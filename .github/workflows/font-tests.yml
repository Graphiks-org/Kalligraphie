name: Kalligraphie verification

on:
  pull_request:
    paths:
      - 'kalligraphie/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'test-fixtures/**'
      - 'docs/docs/generated/**'
      - '.github/workflows/font-tests.yml'
  push:
    branches: [master]
    paths:
      - 'kalligraphie/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'test-fixtures/**'
      - 'docs/docs/generated/**'
      - '.github/workflows/font-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon check

  shaping-native:
    name: HarfBuzz JVM (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted runner labels map to the bundled native targets.
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :kalligraphie:shaping:jvmTest
      - name: Exercise directory captures and system-catalog shaping and glyphs
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon :kalligraphie:jvmTest --tests '*FontDirectoryCatalogTest*' --tests '*SystemFontCatalogJourneyTest*'

  apple-platform-fonts:
    name: CoreText font journeys (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-15-x64
            runner: macos-15-intel
          - target: macos-15-arm64
            runner: macos-15
          - target: macos-26-x64
            runner: macos-26-intel
          - target: macos-26-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - name: Exercise exact fonts, platform ownership and certified layouts
        run: ./gradlew --no-daemon :kalligraphie:platform:apple:jvmTest

  ios-platform-fonts:
    name: CoreText font journeys (ios-simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - name: Exercise the CoreText registry capture and materialization
        run: ./gradlew --no-daemon :kalligraphie:platform:ios:iosSimulatorArm64Test

  shaping-ios:
    name: Bundled HarfBuzz (ios-simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '25', cache: gradle }
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :kalligraphie:shaping:iosSimulatorArm64Test :kalligraphie:conformance:iosSimulatorArm64Test

  windows-platform-fonts:
    name: DirectWrite font journeys (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Exercise the DirectWrite registry capture
        run: ./gradlew --no-daemon :kalligraphie:platform:windows:jvmTest

  shaping-android:
    name: Bundled HarfBuzz (android x86_64)
    # Mirrors the kffi android-device-tests recipe: API 35 google_apis x86_64 emulator with KVM,
    # the repository Android SDK/NDK setup action, and the real ABI the bundled library targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the bundled HarfBuzz backend and conformance on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-parallel :kalligraphie:shaping:connectedAndroidDeviceTest :kalligraphie:conformance:connectedAndroidDeviceTest
