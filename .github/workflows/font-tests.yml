name: Kalligraphie verification

on:
  pull_request:
    paths:
      - 'kalligraphie/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/font-tests.yml'
  push:
    branches: [master]
    paths:
      - 'kalligraphie/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/font-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon check

  shaping-native:
    name: HarfBuzz JVM (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted runner labels map to the bundled native targets.
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :kalligraphie:shaping:jvmTest
      - name: Exercise directory captures and system-catalog shaping and glyphs
        run: ./gradlew --no-daemon :kalligraphie:jvmTest --tests '*FontDirectoryCatalogTest*' --tests '*SystemFontCatalogJourneyTest*'

  apple-platform-fonts:
    name: CoreText font journeys (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-15-x64
            runner: macos-15-intel
          - target: macos-15-arm64
            runner: macos-15
          - target: macos-26-x64
            runner: macos-26-intel
          - target: macos-26-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - name: Exercise exact fonts, platform ownership and certified layouts
        run: ./gradlew --no-daemon :kalligraphie:platform:apple:jvmTest

  ios-platform-fonts:
    name: CoreText font journeys (ios-simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - name: Exercise the CoreText registry capture and materialization
        run: ./gradlew --no-daemon :kalligraphie:platform:ios:iosSimulatorArm64Test
