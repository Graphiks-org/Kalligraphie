name: Golden portability

# The golden fingerprints are one committed record, and every platform reproduces them byte for
# byte. This workflow is that claim, executed: the same `manifest.tsv`, compared by the JVM on five
# runners, by the Android unit-test compilation, by the Android device runtime under ART, and by the
# iOS simulator binary. No job uses a tolerance, and no platform owns a private record.

on:
  pull_request:
    paths:
      - 'kalligraphie/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'test-fixtures/**'
      - 'docs/docs/generated/**'
      - '.github/workflows/golden-portability.yml'
  push:
    branches: [master]
    paths:
      - 'kalligraphie/**'
      - 'buildSrc/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'test-fixtures/**'
      - 'docs/docs/generated/**'
      - '.github/workflows/golden-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-golden:
    name: Golden scenes (JVM ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner labels of the shaping matrix: every architecture the JVM artifact ships.
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - run: chmod +x gradlew
      - name: Verify every catalogued scene against the committed manifest
        run: ./gradlew --no-daemon :kalligraphie:e2e:jvmTest

  android-host-golden:
    name: Golden scenes (android host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - run: chmod +x gradlew
      - name: Verify the portable scenes against the committed manifest
        run: ./gradlew --no-daemon :kalligraphie:e2e:testAndroidHostTest

  android-device-golden:
    name: Golden scenes (android device)
    # The recipe of the shaping device job: API 35 x86_64 with KVM, the repository Android
    # SDK/NDK setup, and the real runtime the portable rasterizer must agree on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the portable scenes on ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-parallel :kalligraphie:e2e:connectedAndroidDeviceTest

  ios-simulator-golden:
    name: Golden scenes (ios simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - name: Verify the portable scenes against the committed manifest
        run: ./gradlew --no-daemon :kalligraphie:e2e:iosSimulatorArm64Test
      - name: Run the portable rasterizer suite, which no other job executes
        run: ./gradlew --no-daemon :kalligraphie:raster-cpu:iosSimulatorArm64Test
