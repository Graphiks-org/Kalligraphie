name: KMP Starter Pack CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: macos-26 # Xcode 26 is required by Compose Multiplatform 1.11.1 for the iOS link
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 1: Determine the test strategy (Deep vs Fast-Track)
      # Check whether the PR targets 'master' or the current branch is 'master'
      - name: Determine Test Strategy
        id: test-strategy
        run: |
          if [[ "${{ github.base_ref }}" == "master" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "strategy=deep" >> $GITHUB_OUTPUT
            echo "Running deep tests (All Targets) for master branch / merge request."
          else
            echo "strategy=fast-track" >> $GITHUB_OUTPUT
            echo "Running JVM Fast-Track tests only."
          fi

      # Step 2: Run Fast-Track tests (JVM only)
      # Runs when neither the PR base nor the current branch is 'master'
      - name: Run JVM Fast-Track Tests
        if: steps.test-strategy.outputs.strategy == 'fast-track'
        run: ./gradlew :shared:jvmTest :font:fontTest --no-daemon --stacktrace

      # Step 3: Run Deep tests (JVM, Android, and iOS Simulator/Link)
      # Runs only for pushes to or pull requests targeting 'master'
      - name: Run Deep Tests (JVM, Android & iOS Simulator)
        if: steps.test-strategy.outputs.strategy == 'deep'
        run: ./gradlew allTests :font:fontTest --no-daemon --stacktrace
